name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run check
      - name: Tests
        run: npm test
      - name: Geen geheimen in repo
        run: npm run check:secrets
      - name: Build
        run: npm run build
      - name: Lighthouse (mobiel, fase 2-eis ≥ 90)
        run: |
          npx astro preview --port 4321 > /dev/null 2>&1 &
          npx -y wait-on@9.0.3 -t 30000 http://localhost:4321/
          mkdir -p .lighthouse
          for page in overzicht agenda zaal-ziggo-dome; do
            npx -y lighthouse@13.6.0 "http://localhost:4321/#$page" --quiet --chrome-flags="--headless=new" \
              --only-categories=performance,accessibility --output=json --output-path=".lighthouse/$page.json"
          done
          node scripts/lighthouse-check.mjs
