name: Fetch events

# Dagelijkse ophaalrun (bouwplan §5). Ook bij wijziging van een adapter, of handmatig.
# Schrijft data/events.json, data/status.json en docs/dekking.md en commit ze naar main.
on:
  schedule:
    - cron: "17 4 * * *" # dagelijks 04:17 UTC (05:17/06:17 in NL)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/adapters/**"
      - "scripts/lib/**"
      - "scripts/fetch.ts"
      - "scripts/genres.ts"
      - "config/venues.yml"
      - "config/categorie-correcties.yml"
      - ".github/workflows/fetch.yml"

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch
        run: npm run fetch
      - name: Music genres (MusicBrainz 1 request/s, then iTunes Search ~18/min)
        run: npm run genres
        continue-on-error: true
        timeout-minutes: 45
      - name: Coverage report
        run: npm run coverage
      - name: Commit data
        run: |
          git config user.name "podiumradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/dekking.md docs/categorie-twijfel.md
          if git diff --cached --quiet; then echo "Geen wijzigingen"; exit 0; fi
          git commit -m "Data: $(date -u +%Y-%m-%d) ($(node -e 'console.log(require("./data/events.json").events.length)') events)"
          # Only data files are committed here. If main got other data meanwhile (another run, a merge), this run's
          # data is the newest, so it wins the conflict (-X theirs = the commit being replayed). Retry once on a race.
          for attempt in 1 2; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          exit 1
